# docs/banking/banking-api-gateway/catalog-info.yaml
# Banking API Gateway — CẤP 1: điểm vào duy nhất từ bên ngoài (mobile app, web, đối tác)
# ─────────────────────────────────────────────────────────────────────────────

specVersion: vsf-idp.io/v2

metadata:
  domain: Platform Engineering
  system: banking-core
  namespace: gateway

spec:
  type: gateway
  id: banking-api-gateway
  name: Banking API Gateway
  description: >
    Cổng vào duy nhất cho toàn bộ client bên ngoài (mobile app, web, đối tác
    open banking qua FAPI). Xử lý xác thực, rate-limit tập trung, định tuyến
    request tới các service nội bộ phía sau.

  owners:
    members:
      - user: v.minhtq7@vinsmartfuture.tech
        role: techlead
      - user: v.phuongvt2@vinsmartfuture.tech
        role: maintainer

  review:
    branch: "main"

  topology:
    # ── Membership ───────────────────────────────────────────────────────────
    - ref: system:banking/banking-core
      reason: Component này thuộc system banking-core

    # ── APIs ──────────────────────────────────────────────────────────────────
    - ref: providesApis:gateway/banking-api-gateway
      protocol: REST
      reason: >
        Expose API công khai cho mobile app, web, và đối tác open banking
        (tuân theo profile FAPI Part 2 Advanced cho các endpoint đọc/ghi)

    - ref: consumesApis:payment/payment-transfer-service
      protocol: REST
      reason: Định tuyến request chuyển tiền của khách hàng vào Payment Transfer Service

    - ref: consumesApis:account/core-account-service
      protocol: REST
      reason: Định tuyến request truy vấn số dư, thông tin tài khoản

    # ── Infrastructure ────────────────────────────────────────────────────────
    - ref: resource:gateway/gateway-redis-cache
      reason: Cache access token, đếm rate-limit theo từng client_id, giảm tải xác thực lặp lại

    - ref: resource:platform/kafka
      reason: Message broker dùng chung toàn platform

    # ── Kafka topics ──────────────────────────────────────────────────────────
    - ref: publishesTo:audit/audit.transaction-log
      protocol: kafka
      reason: Ghi log mọi request đi qua gateway (bắt buộc theo Thông tư 50/2024/TT-NHNN, Điều 18)
