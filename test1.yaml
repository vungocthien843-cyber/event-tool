# docs/vsf-payment/payment-transaction-api/catalog-info.yaml
# Payment Transaction API — core service xử lý giao dịch thanh toán & hoàn tiền
# Chức năng: authorize, capture, refund, settlement, ledger posting, fraud check
# ─────────────────────────────────────────────────────────────────────────────

# specVersion — phiên bản schema của IDP catalog declaration. Cố định: vsf-idp.io/v2
specVersion: vsf-idp.io/v2

metadata:
  # domain — free-text, P&L chủ quản. Tối đa 128 ký tự, không control chars.
  domain: "Payment & Loyalty"        # require -> service.domain_code (VARCHAR 128)

  # system — bounded context. Kết hợp spec.id -> service_key = "{system}.{id}".
  # Format: ^[a-z][a-z0-9-]*$
  system: vsf-payment                # require -> service.system_code

  # namespace — K8s/IAM namespace scope. Format: ^[a-z][a-z0-9-]*$
  namespace: payment                 # require -> service.namespace

spec:
  # type — service = binary HTTP/gRPC API (cần registry.yaml + openapi.yaml)
  type: service                      # require -> service.service_type

  # id — duy nhất trong system. service_key = vsf-payment.payment-transaction-api
  # Format: ^[a-z][a-z0-9-]*$
  id: payment-transaction-api        # require -> service.service_key ({system}.{id})

  # name — hiển thị trên Portal (free-text, không control chars)
  name: Payment Transaction API      # require -> service.name

  # description — mô tả ngắn, hiển thị trang Service Metadata
  description: Core service xử lý authorize/capture/refund và ghi sổ ledger kép cho toàn bộ luồng thanh toán VSF  # optional -> service.description

  owners:
    members:                         # require >=1 techlead -> service_member
      # role: techlead | maintainer | member
      - user: v.longpt42@vinsmartfuture.tech
        role: techlead
      - user: v.huongnt88@vinsmartfuture.tech
        role: techlead
      - user: v.baonh7@vinsmartfuture.tech
        role: maintainer
      - user: v.chaultt3@vinsmartfuture.tech
        role: maintainer
      - user: v.duongvm21@vinsmartfuture.tech
        role: member
      - user: v.anhntn15@vinsmartfuture.tech
        role: member

  # review — spec-review merge gate. branch: nhánh đích MR phải qua review.
  review:
    branch: "main"                   # require để validate merge request

  # topology — dependency graph. ref = "{kind}:{namespace}/{name}"
  topology:                          # optional -> service_dependency
    # ── Membership (direction: partOf) ──────────────────────────────────────
    - ref: system:vsf-payment/vsf-payment   # table -> service_dependency.target_ref
      reason: Component này là một phần của system vsf-payment   # -> service_dependency.reason

    # ── Sibling components (direction: partOf) ──────────────────────────────
    - ref: component:payment/payment-ledger-worker
      reason: Worker ghi sổ kép (double-entry) — consume event capture/refund để post ledger
    - ref: component:payment/payment-settlement-batch
      reason: Batch settlement cuối ngày — đối soát giao dịch với ngân hàng đối tác
    - ref: component:payment/payment-fraud-scorer
      reason: Sidecar chấm điểm rủi ro real-time trước khi authorize giao dịch
    - ref: component:payment/payment-refund-orchestrator
      reason: Orchestrator điều phối luồng hoàn tiền đa bước (saga) khi capture fail

    # ── Infrastructure (direction: partOf) ──────────────────────────────────
    - ref: resource:payment/payment-postgres
      reason: Primary datastore — transactions, ledger_entries, idempotency_keys
    - ref: resource:payment/payment-redis
      reason: Idempotency cache + rate-limit token bucket cho endpoint authorize
    - ref: resource:platform/kafka
      reason: Kafka broker cho toàn bộ event thanh toán
    - ref: resource:platform/vault
      reason: Secret store — khóa ký HMAC webhook & credential ngân hàng đối tác

    # ── APIs ────────────────────────────────────────────────────────────────
    - ref: providesApis:payment/payment-transaction-api   # direction: upstream
      protocol: REST                 # -> service_dependency.protocol
      reason: OpenAPI spec expose lên Portal — POST /authorize /capture /refund
    - ref: consumesApis:iam/iam-api                        # direction: downstream
      protocol: REST
      reason: Xác thực actor & lấy permission binding cho merchant
    - ref: consumesApis:vsf-payment/payment-gateway-adapter
      protocol: gRPC
      reason: Gọi adapter tới cổng thanh toán (Napas, Visa, Mastercard)
    - ref: consumesApis:commerce/order-api
      protocol: REST
      reason: Đối chiếu order amount trước khi capture để chống double-charge

    # ── Kafka topics ────────────────────────────────────────────────────────
    - ref: publishesTo:payment/payment.transaction-events # direction: downstream
      protocol: kafka
      reason: Publish event authorized/captured/refunded cho downstream (loyalty, reconciliation)
    - ref: consumesFrom:commerce/commerce.order-created    # direction: upstream
      protocol: kafka
      reason: Nhận order mới để chuẩn bị pre-authorization
    - ref: consumesFrom:loyalty/loyalty.points-reserved
      protocol: kafka
      reason: Nhận xác nhận điểm loyalty đã giữ trước khi capture

    # Internal dispatch topic — transactional outbox pattern.
    - ref: publishesTo:payment/payment.ledger.dispatch
      protocol: kafka
      reason: Internal outbox dispatch — trigger payment-ledger-worker post sổ kép
